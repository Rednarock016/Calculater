<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <!-- Display Screen -->
        <input type="text" id="display" readonly>

        <!-- Keypad Grid Layout matching the sketch -->
        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn action-btn" onclick="deleteChar()">Delete</button>
            <button class="btn action-btn" onclick="clearDisplay()">clear</button>

            <!-- Row 2 -->
            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn operator-btn" onclick="appendValue('+')">+</button>
            <button class="btn operator-btn" onclick="appendValue('-')">-</button>

            <!-- Row 3 -->
            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn operator-btn" onclick="appendValue('*')">X</button>
            <button class="btn equals-btn" rowspan="2" onclick="calculateResult()">=</button>

            <!-- Row 4 -->
            <button class="btn zero-btn" onclick="appendValue('0')">0</button>
            <button class="btn operator-btn" onclick="appendValue('/')">÷</button>
        </div>
    </div>

</body>
<script src="script.js"></script>
</html>
